name: Promote to OSU

# Deploys a build to OSU Container Services. The homelab follows :latest; OSU
# follows :osu. This workflow points :osu at a build you've tried on the
# homelab, for both the platform and frontend images. Nothing is rebuilt.
#
# GitHub's runners can't reach OSU's GitLab (OSU network only), so the rest
# happens there: the scheduled release.sh job in flux_pit, on the dial-mac
# GitLab runner, checks :osu every 15 minutes, opens a merge request that sets
# the ow-* image tags to the matching sha- tag, and merges it. Flux then rolls
# the pods. See docs/fork/CONTAINER_SERVICES.md, "Updating".
#
# A new platform build runs database migrations on start, so promote when you
# can watch the ow-api logs. To roll back, promote the earlier sha- tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Build to deploy: 'latest' (what the homelab pulls) or a sha-<7> tag from build.yml"
        required: true
        default: latest

concurrency:
  group: promote-osu
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/michael-dial
      TAG: ${{ inputs.tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check both images exist
        run: |
          set -euo pipefail
          if [[ "$TAG" != latest && ! "$TAG" =~ ^sha-[0-9a-f]{7,}$ ]]; then
            echo "::error::tag must be 'latest' or sha-<7>, got '$TAG'"
            exit 1
          fi
          for img in open-wearables-platform open-wearables-frontend; do
            if ! docker buildx imagetools inspect "$REGISTRY/$img:$TAG" >/dev/null; then
              echo "::error::$REGISTRY/$img:$TAG not found. Has build.yml finished for that commit?"
              exit 1
            fi
          done

      # Both images are re-tagged only after both are known to exist, so :osu
      # never points the platform and frontend at different builds by accident.
      - name: Point :osu at the build
        run: |
          set -euo pipefail
          {
            echo "## Promoted \`$TAG\` to \`:osu\`"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for img in open-wearables-platform open-wearables-frontend; do
            docker buildx imagetools create -t "$REGISTRY/$img:osu" "$REGISTRY/$img:$TAG"
            digest="$(docker buildx imagetools inspect "$REGISTRY/$img:osu" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "| \`$img\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo
            echo "flux_pit's scheduled release job (every 15 min, on the Mac's GitLab runner) opens and"
            echo "merges the deploy merge request on its next run; the Mac must be awake and on VPN."
            echo "Flux rolls the pods about 5 minutes after the merge."
          } >> "$GITHUB_STEP_SUMMARY"
